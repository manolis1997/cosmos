name: SCD App

on:
    pull_request:
        branches:
            - development

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: ./pipeline/
        steps:
            - name: Checkout code # Pull the repo into ubuntu system
              uses: actions/checkout@v3

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                python-version: "3.12"
            
            - name: Install Databricks CLI
              run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
            
            - name: Databricks CLI Version
              run: databricks -v
            
            - name: Install uv
              run: pip install uv

            - name: Install uv dependencies
              run: uv sync
            
            - name: Run the Code
              run: python pipeline_code.py --table product --load FL
        
